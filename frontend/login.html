<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supergroupchat login</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f4; --card: #fff; --fg: #1c1917; --muted: #78716c; --err: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --card: #292524; --fg: #f5f5f4; --muted: #a8a29e; --err: #f87171; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; }
  form { background: var(--card); padding: 24px; border-radius: 10px; width: min(320px, calc(100vw - 32px)); box-sizing: border-box; display: grid; gap: 12px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  input, button { font: inherit; padding: 10px; border-radius: 6px; border: 1px solid var(--muted); background: var(--bg); color: var(--fg); }
  button { cursor: pointer; font-weight: 600; }
  .err { color: var(--err); min-height: 1em; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>supergroupchat</h1>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <input name="code" placeholder="6-digit code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required>
  <button>Log in</button>
  <p class="err">{{msg}}</p>
</form>
</body>
</html>
