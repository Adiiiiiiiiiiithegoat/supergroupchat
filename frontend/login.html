<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>supergroupchat login</title>
<style>
  :root { color-scheme: light dark; --bg: #FAF9F5; --card: #F0EEE6; --fg: #141413; --muted: #73726C; --border: #E5E3DA; --accent: #D97757; --err: #B5523F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #262624; --card: #30302E; --fg: #F5F4EE; --muted: #A6A39A; --border: #42413D; --err: #E08A76; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; }
  form { background: var(--card); padding: 28px 24px; border-radius: 16px; width: min(340px, calc(100vw - 32px)); box-sizing: border-box; display: grid; gap: 12px; box-shadow: 0 2px 16px rgb(20 20 19 / .08); }
  h1 { font: 600 22px Georgia, "Times New Roman", serif; margin: 0 0 4px; }
  input, button { font: inherit; padding: 11px 12px; min-height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { cursor: pointer; font-weight: 600; background: var(--accent); border-color: var(--accent); color: #fff; }
  .err { color: var(--err); min-height: 1em; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>supergroupchat</h1>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <input name="code" placeholder="6-digit code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required>
  <button>Log in</button>
  <p class="err">{{msg}}</p>
</form>
</body>
</html>
